# Measured on iPhone 17 screenshots (1206x2622): the blue Open button
# of the system sheet is centered at 68.4%, 54.2% (bbox y 51.5–56.9%).
# 67%,48% missed above the button. Spaces in % points are required.
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "68%, 54%"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "70%, 55%"
- waitForAnimationToEnd:
    timeout: 2500
