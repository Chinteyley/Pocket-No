appId: dev.ctey.pocketno
---
# The iOS 26 "Open in Pocket-No?" sheet is a system alert. Maestro cannot
# reliably match its text, so tap the blue Open button by position after a
# short wait. 67%,48% is empty Home chrome when the sheet is absent.
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: "67%,48%"
- waitForAnimationToEnd:
    timeout: 3000
